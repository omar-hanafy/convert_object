name: Dart CI (convert_object)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [stable, beta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Dart (${{ matrix.sdk }})
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: ${{ matrix.sdk }}

      - name: Cache package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ matrix.sdk }}-${{ hashFiles('pubspec.yaml', 'example/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ matrix.sdk }}-

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos .

      - name: Validate plugin manifests
        run: dart run tool/validate_agent_plugin.dart

      - name: Test
        run: dart test --reporter expanded

      - name: Run examples
        working-directory: example
        run: |
          dart run --enable-asserts lib/main.dart
          dart run --enable-asserts lib/convert_object_example.dart
