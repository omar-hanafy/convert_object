name: Publish convert_object to pub.dev

on:
  push:
    tags:
      - 'convert_object-v*'

permissions: {}

jobs:
  verify-tag-version:
    if: github.event.created
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag and package identity
        run: |
          set -euo pipefail
          name=$(yq -er '.name' pubspec.yaml)
          version=$(yq -er '.version' pubspec.yaml)
          if [[ "$name" != convert_object || "$GITHUB_REF_NAME" != "$name-v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package $name at version $version."
            exit 1
          fi

  publish:
    needs: verify-tag-version
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
    with:
      use-flutter: false
