name: Label Release PR

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect version bump
        id: bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base_version=$(git show "$BASE_SHA:pubspec.yaml" | yq -er '.version')
          head_version=$(yq -er '.version' pubspec.yaml)
          if [ "$base_version" = "$head_version" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update release label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION_BUMPED: ${{ steps.bump.outputs.bumped }}
        with:
          script: |
            const label = 'release';
            const shouldAdd = process.env.VERSION_BUMPED === 'true';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            async function ensureLabel() {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label,
                    color: '0E8A16',
                    description: 'Release PR (version bump)'
                  });
                } else {
                  throw error;
                }
              }
            }

            await ensureLabel();
            const existing = context.payload.pull_request.labels.map((l) => l.name);
            if (shouldAdd && !existing.includes(label)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });
              core.info('Added release label');
              return;
            }
            if (!shouldAdd && existing.includes(label)) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label });
              core.info('Removed release label');
              return;
            }
            core.info('No label change needed');
