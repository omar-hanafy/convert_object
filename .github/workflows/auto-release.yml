name: Auto Tag & Release (convert_object)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  pub-dry-run:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the release lane and changelog
        id: release
        env:
          LANE: ${{ github.base_ref || github.ref_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          name=$(yq -er '.name' pubspec.yaml)
          if [[ "$name" != convert_object ]]; then
            echo "Expected the convert_object package, found $name."
            exit 1
          fi
          version=$(yq -er '.version' pubspec.yaml)
          case "$LANE" in
            main) pattern='^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$' ;;
            dev)  pattern='^[0-9]+\.[0-9]+\.[0-9]+-dev(\.[0-9A-Za-z-]+)*(\+[0-9A-Za-z.-]+)?$' ;;
            *) echo "Unknown release lane: $LANE"; exit 1 ;;
          esac
          if [[ ! $version =~ $pattern ]]; then
            echo "Version $version does not belong on $LANE."
            exit 1
          fi

          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "New branch; no version change to release."
            exit 0
          fi
          previous=$(git show "$BASE_SHA:pubspec.yaml" | yq -er '.version')
          if [[ "$version" == "$previous" ]]; then
            echo "Manifest version remains $version."
            exit 0
          fi

          tag="$name-v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Release tag $tag already exists. Choose an unused version."
            exit 1
          fi

          notes=$(awk -v heading="## $version" '
            /^## / { if (selected) exit; selected = ($0 == heading); next }
            selected && (started || NF) { print; started = 1 }
          ' CHANGELOG.md)
          if [[ -z "$notes" ]]; then
            echo "Missing release notes under '## $version' in CHANGELOG.md."
            exit 1
          fi
          delimiter=$(uuidgen)
          {
            echo "version=$version"
            echo "notes<<$delimiter"
            printf '%s\n' "$notes"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Dart (stable)
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2

      - name: Validate the package and require full Pana points
        run: |
          set -euo pipefail
          dart pub get
          dart pub publish --dry-run
          dart pub global activate pana 0.23.14
          dart pub global run pana:pana --exit-code-threshold 0 .

  tag:
    needs: pub-dry-run
    if: github.event_name == 'push' && needs.pub-dry-run.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push the new release tag
        env:
          GH_TOKEN: ${{ secrets.TAG_PUSH_PAT }}
          TAG: convert_object-v${{ needs.pub-dry-run.outputs.version }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?TAG_PUSH_PAT is required to trigger the publishing workflow.}"
          git tag "$TAG" "$GITHUB_SHA"
          gh auth setup-git --hostname github.com
          git push origin "refs/tags/$TAG"

  release:
    needs: [pub-dry-run, tag]
    if: github.event_name == 'push' && needs.pub-dry-run.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: convert_object-v${{ needs.pub-dry-run.outputs.version }}
          NOTES: ${{ needs.pub-dry-run.outputs.notes }}
          PRERELEASE: ${{ github.ref_name == 'dev' }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NOTES" | gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file - --prerelease="$PRERELEASE"
